name: Build and Upload Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build binaries for release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          EXT=""
          if [ "${GOOS}" == "windows" ]; then EXT=".exe"; fi
          VERSION=${{ github.event.release.tag_name }}
          go build -o dist/goulder-dash-${GOOS}-${GOARCH}${EXT} -ldflags "-X goulder-dash/cmd.Version=$VERSION"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/goulder-dash-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}